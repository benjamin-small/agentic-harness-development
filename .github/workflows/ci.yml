name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package and verify external consumer
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          node scripts/package-release.mjs
          npm run release:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.node }}
          path: coverage/coverage-summary.json
  ci:
    name: ci
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
